[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Prerendered routes are served from dist/<route>/index.html.
# Netlify serves dist/404.html automatically for unknown paths.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
